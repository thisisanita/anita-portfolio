<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bridged Jira board</title>
  <desc id="desc">A snapshot-style illustration of the Bridged product backlog, with planned production work in To Do and completed MVP work in Done.</desc>
  <defs>
