    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#2f2927}.muted{fill:#6f6865}.head{font-size:22px;font-weight:700}.label{font-size:16px;font-weight:700}.card-title{font-size:18px;font-weight:600}.meta{font-size:14px}.card{fill:#fff;stroke:#ded9d5;stroke-width:1.5}.column{fill:#f4f3f1}.done{fill:#e5f3e8}.todo{fill:#e8effc}.key{font-size:14px;font-weight:600;fill:#655f5c}
    </style>
